version: "3.7"

# Cloudflare Container-optimized Docker Compose for y12.ai RMM
# Domain: rmm.y12.ai

networks:
  proxy:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
  api-db: null
  redis: null
  mesh-db: null

volumes:
  y12_data: null
  postgres_data: null
  mongo_data: null
  mesh_data: null
  redis_data: null

services:
  # postgres database for api service
  y12-postgres:
    container_name: y12-postgres
    image: postgres:13-alpine
    restart: always
    environment:
      POSTGRES_DB: y12rmm
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - api-db
    # Cloudflare optimization: reduced memory footprint
    deploy:
      resources:
        limits:
          memory: 512M

  # redis container for celery tasks
  y12-redis:
    container_name: y12-redis
    image: redis:6.0-alpine
    user: 1000:1000
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - redis
    deploy:
      resources:
        limits:
          memory: 256M

  # used to initialize the docker environment
  y12-init:
    container_name: y12-init
    image: ${IMAGE_REPO}tactical:${VERSION}
    restart: on-failure
    command: ["tactical-init"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASS}
      POSTGRES_DB: y12rmm
      POSTGRES_HOST: y12-postgres
      APP_HOST: ${APP_HOST}
      API_HOST: ${API_HOST}
      CSRF_COOKIE_DOMAIN: ${CSRF_COOKIE_DOMAIN}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN}
      MESH_USER: ${MESH_USER}
      MESH_HOST: ${MESH_HOST}
      MESH_SERVICE: y12-meshcentral
      TRMM_USER: ${TRMM_USER}
      TRMM_PASS: ${TRMM_PASS}
      TRMM_DISABLE_WEB_TERMINAL: ${TRMM_DISABLE_WEB_TERMINAL}
      TRMM_DISABLE_SERVER_SCRIPTS: ${TRMM_DISABLE_SERVER_SCRIPTS}
      TRMM_DISABLE_SSO: "False"
      REDIS_HOST: y12-redis
      # Google OAuth settings
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_AUTH_ONLY: ${GOOGLE_AUTH_ONLY:-True}
    depends_on:
      - y12-postgres
      - y12-meshcentral
      - y12-redis
    networks:
      - api-db
      - proxy
      - redis
    volumes:
      - y12_data:/opt/tactical
      - mesh_data:/meshcentral-data
      - mongo_data:/mongo/data/db
      - redis_data:/redis/data

  # nats
  y12-nats:
    container_name: y12-nats
    image: ${IMAGE_REPO}tactical-nats:${VERSION}
    user: 1000:1000
    restart: always
    environment:
      API_HOST: ${API_HOST}
    volumes:
      - y12_data:/opt/tactical
    networks:
      api-db: null
      proxy:
        aliases:
          - ${API_HOST}
    deploy:
      resources:
        limits:
          memory: 128M

  # meshcentral container
  y12-meshcentral:
    container_name: y12-meshcentral
    image: ${IMAGE_REPO}tactical-meshcentral:${VERSION}
    user: 1000:1000
    restart: always
    environment:
      MESH_HOST: ${MESH_HOST}
      MESH_USER: ${MESH_USER}
      MESH_PASS: ${MESH_PASS}
      MONGODB_USER: ${MONGODB_USER}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      MESH_PERSISTENT_CONFIG: ${MESH_PERSISTENT_CONFIG}
    networks:
      proxy:
        aliases:
          - ${MESH_HOST}
      mesh-db: null
    volumes:
      - y12_data:/opt/tactical
      - mesh_data:/home/node/app/meshcentral-data
    depends_on:
      - y12-mongodb
    deploy:
      resources:
        limits:
          memory: 512M

  # mongodb container for meshcentral
  y12-mongodb:
    container_name: y12-mongodb
    image: mongo:4.4
    user: 1000:1000
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: meshcentral
    networks:
      - mesh-db
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          memory: 512M

  # container that hosts vue frontend
  y12-frontend:
    container_name: y12-frontend
    image: ${IMAGE_REPO}tactical-frontend:${VERSION}
    user: 1000:1000
    restart: always
    networks:
      - proxy
    volumes:
      - y12_data:/opt/tactical
    environment:
      API_HOST: ${API_HOST}
    deploy:
      resources:
        limits:
          memory: 128M

  # container for django backend
  y12-backend:
    container_name: y12-backend
    image: ${IMAGE_REPO}tactical:${VERSION}
    user: 1000:1000
    command: ["tactical-backend"]
    restart: always
    environment:
      POSTGRES_HOST: y12-postgres
      REDIS_HOST: y12-redis
      # Google OAuth settings
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_AUTH_ONLY: ${GOOGLE_AUTH_ONLY:-True}
    networks:
      - proxy
      - api-db
      - redis
    volumes:
      - y12_data:/opt/tactical
    depends_on:
      - y12-postgres
    deploy:
      resources:
        limits:
          memory: 512M

  # container for django websockets connections
  y12-websockets:
    container_name: y12-websockets
    image: ${IMAGE_REPO}tactical:${VERSION}
    user: 1000:1000
    command: ["tactical-websockets"]
    restart: always
    environment:
      POSTGRES_HOST: y12-postgres
      REDIS_HOST: y12-redis
    networks:
      - proxy
      - api-db
      - redis
    volumes:
      - y12_data:/opt/tactical
    depends_on:
      - y12-postgres
      - y12-backend
    deploy:
      resources:
        limits:
          memory: 256M

  # container for cloudflare-optimized reverse proxy
  y12-nginx:
    container_name: y12-nginx
    image: ${IMAGE_REPO}tactical-nginx:${VERSION}
    user: 1000:1000
    restart: always
    environment:
      APP_HOST: ${APP_HOST}
      API_HOST: ${API_HOST}
      MESH_HOST: ${MESH_HOST}
      CERT_PUB_KEY: ${CERT_PUB_KEY}
      CERT_PRIV_KEY: ${CERT_PRIV_KEY}
      BACKEND_SERVICE: y12-backend
      FRONTEND_SERVICE: y12-frontend
      MESH_SERVICE: y12-meshcentral
      WEBSOCKETS_SERVICE: y12-websockets
      NATS_SERVICE: y12-nats
      # Cloudflare settings
      REAL_IP_HEADER: CF-Connecting-IP
      TRUSTED_PROXIES: "173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22"
    networks:
      proxy:
        ipv4_address: 172.20.0.20
    ports:
      - "${TRMM_HTTP_PORT:-80}:8080"
      - "${TRMM_HTTPS_PORT:-443}:4443"
    volumes:
      - y12_data:/opt/tactical
    deploy:
      resources:
        limits:
          memory: 128M

  # container for celery worker service
  y12-celery:
    container_name: y12-celery
    image: ${IMAGE_REPO}tactical:${VERSION}
    user: 1000:1000
    command: ["tactical-celery"]
    restart: always
    environment:
      POSTGRES_HOST: y12-postgres
      REDIS_HOST: y12-redis
    networks:
      - redis
      - proxy
      - api-db
    volumes:
      - y12_data:/opt/tactical
    depends_on:
      - y12-postgres
      - y12-redis
    deploy:
      resources:
        limits:
          memory: 512M

  # container for celery beat service
  y12-celerybeat:
    container_name: y12-celerybeat
    image: ${IMAGE_REPO}tactical:${VERSION}
    user: 1000:1000
    command: ["tactical-celerybeat"]
    restart: always
    environment:
      POSTGRES_HOST: y12-postgres
      REDIS_HOST: y12-redis
    networks:
      - proxy
      - redis
      - api-db
    volumes:
      - y12_data:/opt/tactical
    depends_on:
      - y12-postgres
      - y12-redis
    deploy:
      resources:
        limits:
          memory: 256M
